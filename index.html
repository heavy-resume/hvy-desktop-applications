<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HVY Galaxy</title>
    <style>
      :root {
        --hvy-bg: #f5f9ff;
        --hvy-text: #1a2530;
      }

      .startup-loading {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: var(--hvy-bg);
        color: var(--hvy-text);
        font: 14px system-ui;
      }
    </style>
    <script>
      try {
        const savedTheme = JSON.parse(localStorage.getItem('hvy-galaxy-color-theme-v1') || '{}');
        const colors = savedTheme && typeof savedTheme.colors === 'object' && !Array.isArray(savedTheme.colors)
          ? savedTheme.colors
          : {};
        for (const [name, value] of Object.entries(colors)) {
          if (name.startsWith('--hvy-') && typeof value === 'string' && value.trim()) {
            document.documentElement.style.setProperty(name, value.trim());
          }
        }
      } catch {
        // The normal startup path will restore defaults for unreadable settings.
      }
    </script>
  </head>
  <body>
    <div id="app">
      <main class="startup-loading">
        Loading HVY Galaxy...
      </main>
    </div>
    <script>
      function showStartupError(error) {
        const root = document.getElementById('app');
        if (!root) return;
        root.innerHTML = '<main style="padding:24px;font:14px system-ui;color:#8c291d;background:#fff0ec;min-height:100vh"><h1>Startup error</h1><pre style="white-space:pre-wrap"></pre></main>';
        root.querySelector('pre').textContent = error && error.stack ? error.stack : String(error);
      }
      window.addEventListener('error', (event) => {
        showStartupError(event.error || event.message);
      });
      window.addEventListener('unhandledrejection', (event) => {
        showStartupError(event.reason);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
